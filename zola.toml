base_url = "https://nsrahmad.github.io"
title = "Nisar's site"
description = ""
default_language = "en"
theme = "serene"
output_dir = "public"
compile_sass = true
minify_html = false # Keep this false, as it may cause issues with some styles
build_search_index = false # Keep this false, search is temporarily unsupported
generate_feeds = false # Whether to generate a feed file in root, read docs for more info about rss feed
feed_filenames = ["rss.xml"] # "feed.xml" | "atom.xml" | "rss.xml", read docs for more info
taxonomies = [{ name = "tags" }, { name = "categories" }]


[markdown]
render_emoji = false
external_links_target_blank = false
external_links_no_follow = true
external_links_no_referrer = true
smart_punctuation = true
github_alerts = true

[markdown.highlighting]
style = "class"
light_theme = "github-light"
dark_theme = "github-dark"

[slugify]
paths = "on"
taxonomies = "on"
anchors = "on"

#=========================================================================================

[extra]

nav = [
  { name = "posts", path = "/posts" },
  { name = "tags", path = "/tags" },
]

name = "Nisar Ahmad"
handle = "nsrahmad"
bio = "Hobbyist Programmer"
links = [
  { name = "GitHub", icon = "github", url = "https://github.com/nsrahmad" },
  { name = "Email", icon = "email", url = "mailto:nisarahmad1324@gmail.com" },
  { name = "Mastodon", icon = "mastodon", url = "https://privacysafe.social/@nsrahmad", rel_me = true },
]

blog_section_path = "/posts"

back_link_text = "Back" # Text of the back button
color_scheme = "auto"

footer_copyright = "© 2026 Nisar Ahmad"
footer_credits = false # Whether to show "Built with zola and serene" in footer

not_found_error_text = "404 Not Found"
not_found_recover_text = "« back to home »"

date_format = "%b %-d, %Y"
toc = true
code_copy = true
comment = false
math = false
mermaid = false
outdated_alert = true
outdated_alert_days = 120
outdated_alert_text_before = "This article was last updated "
outdated_alert_text_after = " days ago and may be out of date."

reaction = false # Whether to enable anonymous emoji reactions (Note: You need to set up a working api endpoint to enable this feature)
reaction_align = "right" # "left" | "center" | "right"
reaction_endpoint = "https://example.com/api/reaction"
