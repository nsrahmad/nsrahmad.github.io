  <style>

  /* light mode colors */
body {
  /* A vibrant, modern Royal Blue for better pop and accessibility */
  --primary-color: #2563eb;
  --primary-pale-color: #2563eb1a;  /* 10% opacity */
  --primary-decoration-color: #2563eb14; /* 8% opacity */

  --bg-color: #ffffff;

  /* Deep gray-blue instead of flat gray for richer contrast */
  --text-color: #111827;
  --text-pale-color: #4b5563;       /* Darker pale text to meet WCAG contrast guidelines */
  --text-decoration-color: #d1d5db;
  --highlight-mark-color: #2563eb26; /* 15% opacity */

  /* Callouts updated to bright, distinct, semantic hues */
  --callout-note-color: #2563eb;     /* Blue */
  --callout-tip-color: #16a34a;      /* Emerald Green */
  --callout-important-color: #9333ea;/* Vibrant Purple */
  --callout-warning-color: #ea580c;  /* Bright Orange */
  --callout-caution-color: #dc2626;  /* Strong Red */
}

/* dark mode colors */
body.dark {
  /* A bright, soft sky blue that is highly legible on dark backgrounds */
  --primary-color: #60a5fa;
  --primary-pale-color: #60a5fa26;   /* 15% opacity */
  --primary-decoration-color: #60a5fa14; /* 8% opacity */

  /* A deep, slightly cool-tinted dark gray (far more premium than flat #1c1c1c) */
  --bg-color: #111827;

  /* Off-white and medium-light grays to reduce eye strain while keeping contrast high */
  --text-color: #f3f4f6;
  --text-pale-color: #9ca3af;
  --text-decoration-color: #374151;
  --highlight-mark-color: #60a5fa33; /* 20% opacity */

  /* Callouts updated to neon/pastel variants so they glow nicely in dark mode */
  --callout-note-color: #60a5fa;     /* Sky Blue */
  --callout-tip-color: #4ade80;      /* Light Green */
  --callout-important-color: #c084fc;/* Light Purple */
  --callout-warning-color: #fb923c;  /* Light Orange */
  --callout-caution-color: #f87171;  /* Light Red */
}

  /* typography */
  body {
    --main-font: 'Linux Biolinum', ui-sans-serif, system-ui, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', 'Noto Color Emoji';

    --homepage-max-width: 768px;

    --avatar-size: 60px;

    --block-code-border-radius: 0px;
    --block-code-border-color: var(--primary-color);
    --detail-border-color: var(--primary-color);
  }

<body class="not-found">
  
  <script>
    const theme = sessionStorage.getItem('theme');
    const match = window.matchMedia("(prefers-color-scheme: dark)").matches;
    if ((theme && theme == 'dark') || (!theme && match)) {
      document.body.classList.add('dark');
      const hl = document.querySelector('link#hl');
      if (hl) hl.href = 'https://nsrahmad.github.io/giallo-dark.css';
    }
  </script>
  
  
<div class="wrapper">
