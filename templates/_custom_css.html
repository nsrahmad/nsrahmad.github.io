<style>

  /* light mode colors */
body {
  /* A vibrant, modern Royal Blue for better pop and accessibility */

  --bg-color: #ffffff;

  /* Deep gray-blue instead of flat gray for richer contrast */

  --text-pale-color: #4b5563;       /* Darker pale text to meet WCAG contrast guidelines */
  --text-decoration-color: #d1d5db;

  --callout-warning-color: #ea580c;  /* Bright Orange */
  --callout-caution-color: #dc2626;  /* Strong Red */
}

/* dark mode colors */
body.dark {
  /* A bright, soft sky blue that is highly legible on dark backgrounds */

  --primary-pale-color: #60a5fa26;   /* 15% opacity */

  /* A deep, slightly cool-tinted dark gray (far more premium than flat #1c1c1c) */
